# Fetch fresh data and run the SageMaker Pipeline. Started by hand from the Actions tab.
# Signs in to AWS with OpenID Connect: no access keys are stored in GitHub.
name: run-pipeline

on:
  workflow_dispatch:
    inputs:
      train_in_processing:
        description: "Run Train as a processing job (account without training-job quota)"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: a second run on the same day would overwrite raw/<date>/ while the first reads it.
concurrency:
  group: run-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: sagemaker  # the only place the AWS role trusts
    permissions:
      contents: read
      id-token: write  # lets the job ask GitHub for an OIDC token to sign in to AWS
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.WX_BLEND_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Fetch data and upload to S3
        id: fetch
        env:
          WX_AWS_ACCOUNT: ${{ vars.WX_AWS_ACCOUNT }}
        run: uv run python scripts/fetch.py --out build/raw --s3
      - name: Run the pipeline and wait
        env:
          RAW_URI: ${{ steps.fetch.outputs.raw_uri }}
          TRAIN_IN_PROCESSING: ${{ inputs.train_in_processing }}
          WX_AWS_ACCOUNT: ${{ vars.WX_AWS_ACCOUNT }}
        run: |
          extra=""
          if [ "$TRAIN_IN_PROCESSING" = "true" ]; then extra="--train-in-processing"; fi
          uv run python scripts/pipeline.py --run \
            --raw "$RAW_URI" $extra
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: pipeline-run
          path: reports/pipeline_runs.json
