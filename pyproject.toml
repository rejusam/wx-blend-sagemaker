[project]
name = "wx-blend-sagemaker"
version = "0.1.0"
description = "Learned blend of weather models for next-day maximum temperature, trained and gated in a SageMaker Pipeline."
authors = [{ name = "Reju Sam John" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
# What the three pipeline steps need. The SageMaker scikit-learn container already has these.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
# Defining, starting and reading the pipeline from a laptop or GitHub Actions.
pipeline = [
    "boto3>=1.40",
    "sagemaker==2.257.7",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
default-groups = ["dev", "pipeline"]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Sets an environment variable before importing the SageMaker SDK.
"scripts/pipeline.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["steps", "scripts"]
addopts = "-q --tb=short"
